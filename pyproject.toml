[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "albaa"
version = "0.1.0"
description = "Al-Baa Arabic programming language"
authors = [
    {name = "Saud"}
]


[project.scripts]
albaa = "arabicpy.__main__:run"


[tool.setuptools]
packages = ["arabicpy"]
