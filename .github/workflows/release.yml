name: Build release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: albaa-release
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller PySide6 .

      - name: Generate release version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "ALBAA_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $versionFile = Get-Content ".\arabicpy\version.py" -Raw
          $versionFile = $versionFile -replace '__version__ = "[^"]+"', "__version__ = `"$version`""
          Set-Content ".\arabicpy\version.py" $versionFile -Encoding utf8

      - name: Prepare embedded AI engine
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\prepare_embedded_ai.ps1

      - name: Build application bundle
        shell: pwsh
        run: .\build_exe.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:ALBAA_RELEASE_VERSION" ".\AlBaaInstaller.iss"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:ALBAA_RELEASE_VERSION
          $installer = ".\dist\installer\AlBaa-Setup-$version-x64.exe"
          gh release create "v$version" $installer --target "${{ github.sha }}" --generate-notes --title "Al-Baa $version"

  linux-deb:
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libx11-xcb1 libxrender1 libxi6
          python -m pip install --upgrade pip pyinstaller PySide6 .

      - name: Generate release version
        run: |
          version="1.0.${{ github.run_number }}"
          echo "ALBAA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"$version\"/" arabicpy/version.py

      - name: Build .deb package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$ALBAA_RELEASE_VERSION"
          gh release upload "v$version" "dist/deb/albaa_${version}_amd64.deb" --clobber
